sample:
  name: pixpaper-213m e-paper - image (raw SPI) on Kakip CM33
  description: >
    Show a bundled image on the Open-EP pixpaper-213m 2.13" monochrome e-paper
    panel, driven over RSPI0 by the Cortex-M33 of the Kakip (RZ/V2H) board.
tests:
  sample.boards.kakip.pixpaper_213m.image:
    platform_allow:
      - rzv2h_evk/r9a09g057h44gbg/cm33
    tags:
      - spi
      - gpio
      - displays
    depends_on:
      - spi
      - gpio
    build_only: true
