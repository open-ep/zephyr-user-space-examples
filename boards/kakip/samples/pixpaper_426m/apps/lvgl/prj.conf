CONFIG_GPIO=y
CONFIG_SPI=y
CONFIG_DISPLAY=y

CONFIG_LOG=y
CONFIG_MAIN_STACK_SIZE=8192

# LVGL on a 1-bit e-paper panel.
CONFIG_LVGL=y
CONFIG_LV_COLOR_DEPTH_1=y
CONFIG_LV_Z_MEM_POOL_SIZE=131072
# LVGL redraws only what changed (a 25%-of-screen draw buffer); the driver batches
# the areas of one LVGL refresh into a single panel update.
CONFIG_LV_Z_VDB_SIZE=25
CONFIG_LV_FONT_MONTSERRAT_14=y
CONFIG_LV_FONT_MONTSERRAT_28=y
CONFIG_LV_FONT_MONTSERRAT_48=y
CONFIG_LV_USE_THEME_MONO=y

# SCI5: the FSP UART driver always enables the RXI/ERI interrupt lines, but Zephyr only
# installs handlers in interrupt-driven mode. Without this, any byte or line error on RXD
# ends in "Unhandled IRQn: 144" (ERI) / 145 (RXI).
CONFIG_UART_INTERRUPT_DRIVEN=y
