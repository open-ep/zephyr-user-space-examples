CONFIG_PRINTK=y
# no UART on this core: printk goes to the shared ring (src/main.c)
CONFIG_SERIAL=n
CONFIG_CONSOLE=n
CONFIG_UART_CONSOLE=n
# zephyr.bin would span 0x0 (ITCM vectors) .. 0x0818xxxx (SRAM) = ~135 MB of padding;
# CMakeLists.txt writes the two loadable pieces instead (cr8_itcm.bin, cr8_sram.bin)
CONFIG_BUILD_OUTPUT_BIN=n
