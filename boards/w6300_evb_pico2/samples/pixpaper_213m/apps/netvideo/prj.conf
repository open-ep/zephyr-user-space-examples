# Panel over bit-banged GPIO + W6300 ethernet with a TCP frame server.
CONFIG_GPIO=y

CONFIG_NETWORKING=y
CONFIG_NET_IPV4=y
CONFIG_NET_IPV6=n
CONFIG_NET_TCP=y
CONFIG_NET_SOCKETS=y
CONFIG_NET_L2_ETHERNET=y
CONFIG_NET_DHCPV4=y
CONFIG_NET_MGMT=y
CONFIG_NET_MGMT_EVENT=y

CONFIG_NET_PKT_RX_COUNT=16
CONFIG_NET_PKT_TX_COUNT=16
CONFIG_NET_BUF_RX_COUNT=64
CONFIG_NET_BUF_TX_COUNT=64
CONFIG_NET_MAX_CONTEXTS=8
# window must stay well under the RX buf pool (64 x 128 B = 8 KB): a fast
# sender fills the whole window at wire speed, and an exhausted pool makes
# the stack RST the connection (seen from Windows at every clip upload)
CONFIG_NET_TCP_MAX_RECV_WINDOW_SIZE=2048

# fast recovery for the edge-miss polling fallback in eth_w6300
CONFIG_ETH_WIZNET_MONITOR_PERIOD=100

CONFIG_MAIN_STACK_SIZE=4096
CONFIG_HEAP_MEM_POOL_SIZE=16384
CONFIG_ENTROPY_GENERATOR=y
CONFIG_TEST_RANDOM_GENERATOR=y
CONFIG_PRINTK=y
