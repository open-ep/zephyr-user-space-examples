sample:
  name: pixpaper-213m e-paper - boot image
  description: >
    Draw a bundled image on the Open-EP pixpaper-213m 2.13" mono e-paper panel at boot, then put the panel into deep sleep.
tests:
  sample.boards.openep.w6300_evb_pico2.boot_image:
    platform_allow:
      - w6300_evb_pico2/rp2350a/m33
      - rpi_pico2/rp2350a/m33
    tags:
      - gpio
      - displays
    depends_on:
      - gpio
    build_only: true
