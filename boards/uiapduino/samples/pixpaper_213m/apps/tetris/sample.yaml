sample:
  name: pixpaper-213m e-paper - tetris autoplay (partial update)
  description: >
    Self-playing Tetris on the Open-EP pixpaper-213m 2.13" monochrome
    e-paper panel held in portrait (10x20 well). A greedy one-piece
    lookahead AI picks each drop; the falling piece is drawn with the
    dual-plane partial-update discipline and every line clear pays off
    ghosting with one full refresh. No input, no UART.
tests:
  sample.boards.uiap.uiapduino.pixpaper_213m.tetris:
    platform_allow:
      - uiapduino_pro_micro_ch32v003
    tags:
      - gpio
      - displays
    depends_on:
      - gpio
    build_only: true
